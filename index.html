<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>HHD Stock Take</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body { background: #0f0f1a; color: #e8e8f0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 16px; }
  .screen { width: 100%; max-width: 440px; display: none; flex-direction: column; gap: 16px; }
  .screen.active { display: flex; }
  .card { background: #1a1a2e; border: 1px solid #2a2a45; border-radius: 14px; padding: 20px; }
  .label { font-size: 11px; color: #8888aa; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px; }
  .val { font-size: 22px; font-weight: 800; color: #f7a34f; letter-spacing: 1px; font-family: 'Courier New', monospace; }
  .tid-badge { background: rgba(79, 142, 247, 0.15); border: 1px solid #4f8ef7; border-radius: 6px; padding: 4px 10px; font-size: 12px; color: #4f8ef7; font-family: monospace; display: inline-block; margin-bottom: 12px; }
  input { width: 100%; background: #0f0f1a; border: 2px solid #2a2a45; border-radius: 10px; color: white; font-size: 18px; padding: 12px 14px; outline: none; font-weight: 600; }
  input:focus { border-color: #4f8ef7; }
  .btn { width: 100%; padding: 14px; border-radius: 10px; border: none; font-size: 16px; font-weight: 700; cursor: pointer; transition: transform 0.1s; }
  .btn:active { transform: scale(0.98); }
  .btn-primary { background: #4f8ef7; color: white; }
  .btn-success { background: #4fd97e; color: #0f0f1a; }
  .btn-danger { background: #f75f5f; color: white; }
  .btn-ghost { background: #252540; color: white; }
  .alert { padding: 12px; border-radius: 8px; font-size: 13px; font-weight: 600; display: none; }
  .alert-error { background: rgba(247,95,95,0.2); border: 1px solid #f75f5f; color: #f75f5f; }
  .alert-success { background: rgba(79,217,126,0.2); border: 1px solid #4fd97e; color: #4fd97e; }
  .barcode-wrap { background: white; padding: 16px; border-radius: 12px; display: flex; justify-content: center; align-items: center; margin: 16px 0; }
  .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.8); display: none; justify-content: center; align-items: center; padding: 20px; z-index: 999; }
  .modal { background: #1a1a2e; border: 1px solid #2a2a45; border-radius: 14px; padding: 20px; width: 100%; max-width: 380px; text-align: center; }
</style>
</head>
<body>

<!-- LOGIN SCREEN -->
<div class="screen active" id="screen-login">
  <div class="card" style="text-align:center;">
    <h1 style="font-size:22px; margin-bottom:6px;">? Stock Take HHD</h1>
    <p style="font-size:13px; color:#8888aa; margin-bottom:20px;">Enter Employee Code to start</p>
    <div style="text-align:left;">
      <div class="label">Employee Code / ID</div>
      <input type="text" id="empInput" placeholder="e.g. 7890" autocomplete="off">
    </div>
    <div class="alert alert-error" id="loginAlert" style="margin-top:12px;"></div>
    <button class="btn btn-primary" style="margin-top:16px;" onclick="doLogin()">Start Audit</button>
    <p style="font-size:11px; color:#8888aa; margin-top:16px;">Published: 31/7/2026, 10:13:50 am</p>
  </div>
</div>

<!-- AUDIT SCREEN -->
<div class="screen" id="screen-audit">
  <div class="card">
    <div class="tid-badge" id="dispTid">ST-0000</div>
    
    <div class="label">Location</div>
    <div class="val" id="dispLoc" style="color:#f7a34f; margin-bottom:12px;">-</div>

    <div class="label">WID</div>
    <div class="val" id="dispWid" style="color:#4f8ef7; margin-bottom:12px;">-</div>

    <div class="label">Count Progress</div>
    <div class="val" id="dispCount" style="color:#ffffff;">0 / 0</div>
  </div>

  <div class="card">
    <div class="label">Scan / Enter WSN</div>
    <input type="text" id="wsnInput" placeholder="Scan WSN..." autocomplete="off" onkeydown="if(event.key==='Enter') validateScannedWSN()">
    <div class="alert alert-error" id="auditAlert" style="margin-top:10px;"></div>
    <div class="alert alert-success" id="auditSuccess" style="margin-top:10px;"></div>
    
    <div style="display:flex; gap:10px; margin-top:14px;">
      <button class="btn btn-primary" style="flex:1;" onclick="validateScannedWSN()">Submit WSN</button>
    </div>
  </div>
</div>

<!-- INTERACTIVE WSN ACTION MODAL -->
<div class="modal-overlay" id="actionModal">
  <div class="modal">
    <h3 style="margin-bottom:8px; color:#4fd97e;">WSN Validated</h3>
    <p style="font-size:14px; color:#8888aa; margin-bottom:14px;" id="modalWsnText">WSN: -</p>
    <p style="font-size:13px; margin-bottom:16px;">Select condition for this specific WSN:</p>
    
    <div style="display:flex; flex-direction:column; gap:10px;">
      <button class="btn btn-success" onclick="confirmWSNStatus('Done', 'Verified')">? Verify / OK</button>
      <button class="btn btn-danger" onclick="promptIssueForWSN()">?? Report Issue</button>
    </div>
  </div>
</div>

<!-- SUMMARY & 2D BARCODE SCREEN -->
<div class="screen" id="screen-summary">
  <div class="card" style="text-align:center;">
    <h2 style="font-size:20px; color:#4fd97e;">Stock Take Complete!</h2>
    <p style="font-size:13px; color:#8888aa; margin-top:4px;">Scan this 2D Barcode with Supervisor Scanner</p>
    
    <div class="barcode-wrap">
      <div id="qrcode"></div>
    </div>
    
    <div style="font-size:12px; color:#8888aa; text-align:left; background:#0f0f1a; padding:10px; border-radius:8px;" id="summaryDetails"></div>
    <button class="btn btn-ghost" style="margin-top:16px;" onclick="location.reload()">Next Session</button>
  </div>
</div>

let currentEmp = '';
let assignments = [];
let currentIdx = 0;
let scannedWSNs = [];
let sessionResults = [];
let pendingValidatedWSN = '';

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function doLogin() {
  const code = document.getElementById('empInput').value.trim().toUpperCase();
  if (!code) return showLoginErr('Please enter Employee ID');
  
  if (!EMP_DATA[code] || !EMP_DATA[code].length) {
    return showLoginErr('No Stock Take assigned to Employee: ' + code);
  }

  currentEmp = code;
  assignments = EMP_DATA[code];
  currentIdx = 0;
  scannedWSNs = [];
  sessionResults = [];

  showScreen('screen-audit');
  loadCurrentItem();
}

function showLoginErr(msg) {
  const el = document.getElementById('loginAlert');
  el.textContent = msg;
  el.style.display = 'block';
}

function loadCurrentItem() {
  if (currentIdx >= assignments.length) {
    return renderSummary();
  }

  const item = assignments[currentIdx];
  document.getElementById('dispTid').textContent = 'Stock Take ID: ' + item.tid;
  document.getElementById('dispLoc').textContent = item.location;
  document.getElementById('dispWid').textContent = item.wid;
  document.getElementById('dispCount').textContent = scannedWSNs.length + ' / ' + item.expectedCount;
  
  document.getElementById('wsnInput').value = '';
  document.getElementById('wsnInput').focus();
  
  hideAlerts();
}

function hideAlerts() {
  document.getElementById('auditAlert').style.display = 'none';
  document.getElementById('auditSuccess').style.display = 'none';
}

function validateScannedWSN() {
  hideAlerts();
  const input = document.getElementById('wsnInput').value.trim().toUpperCase();
  const item = assignments[currentIdx];

  if (!input) return;

  const validWSNs = item.wsns.map(w => w.toUpperCase());
  if (!validWSNs.includes(input)) {
    const err = document.getElementById('auditAlert');
    err.textContent = '? WSN Mismatch for WID: ' + item.wid;
    err.style.display = 'block';
    document.getElementById('wsnInput').value = '';
    return;
  }

  if (scannedWSNs.includes(input)) {
    const err = document.getElementById('auditAlert');
    err.textContent = '?? WSN already scanned!';
    err.style.display = 'block';
    return;
  }

  pendingValidatedWSN = input;
  document.getElementById('modalWsnText').textContent = 'WSN: ' + input + ' (WID: ' + item.wid + ')';
  document.getElementById('actionModal').style.display = 'flex';
}

function confirmWSNStatus(status, remark) {
  document.getElementById('actionModal').style.display = 'none';
  
  const wsn = pendingValidatedWSN;
  const item = assignments[currentIdx];

  scannedWSNs.push(wsn);
  sessionResults.push({ wsn: wsn, status: status, remark: remark });

  const succ = document.getElementById('auditSuccess');
  succ.textContent = (status === 'Done' ? '? Verified: ' : '?? Issue Marked: ') + wsn;
  succ.style.display = 'block';

  pendingValidatedWSN = '';

  if (scannedWSNs.length >= item.expectedCount) {
    currentIdx++;
    scannedWSNs = [];
    setTimeout(loadCurrentItem, 600);
  } else {
    document.getElementById('dispCount').textContent = scannedWSNs.length + ' / ' + item.expectedCount;
    document.getElementById('wsnInput').value = '';
    document.getElementById('wsnInput').focus();
  }
}

function promptIssueForWSN() {
  const remark = prompt('Describe Issue for WSN ' + pendingValidatedWSN + ':') || 'Battery';
  confirmWSNStatus('Issue', remark);
}

function renderSummary() {
  showScreen('screen-summary');

  const stockTakeId = assignments[0].tid;
  const payload = currentEmp + '|' + stockTakeId + '|' + sessionResults.map(r => r.wsn + ':' + r.status + ':' + r.remark).join(';');

  document.getElementById('summaryDetails').innerHTML = 
    '<strong>Employee:</strong> ' + currentEmp + '<br>' +
    '<strong>Stock Take ID:</strong> ' + stockTakeId + '<br>' +
    '<strong>Total Items Audited:</strong> ' + sessionResults.length;

  const qrel = document.getElementById("qrcode");
  qrel.innerHTML = "";
  new QRCode(qrel, {
    text: payload,
    width: 240,
    height: 240,
    correctLevel: QRCode.CorrectLevel.L
  });
}

document.getElementById('empInput').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
</script>
