<title>HHD Stock Take</title>

<style>
  body { background: #0f0f1a; color: #e8e8f0; font-family: sans-serif; padding: 15px; margin: 0; }
  .card { background: #1a1a2e; border: 1px solid #2a2a45; border-radius: 12px; padding: 16px; margin-bottom: 15px; }
  .label { font-size: 11px; color: #8888aa; text-transform: uppercase; }
  .val { font-size: 20px; font-weight: bold; color: #f7a34f; margin-bottom: 8px; }
  .wsn-val { font-size: 16px; color: #4fd97e; font-family: monospace; }
  input { width: 100%; box-sizing: border-box; padding: 12px; background: #0f0f1a; border: 1px solid #2a2a45; color: white; font-size: 16px; border-radius: 8px; margin-top: 8px; }
  .btn { width: 100%; padding: 14px; border: none; border-radius: 8px; font-weight: bold; font-size: 16px; cursor: pointer; margin-top: 8px; }
  .btn-primary { background: #4f8ef7; color: white; }
  .btn-danger { background: #f75f5f; color: white; }
  .btn-ghost { background: #252540; color: white; }
  #qrcode { background: white; padding: 16px; border-radius: 8px; display: inline-block; margin-top: 15px; }

<body>

<div id="login-screen" class="card">
  <h2>HHD Stock Take</h2>
  <div class="label">Employee ID</div>
  <input type="text" id="empId" placeholder="Enter ID">
  <button class="btn btn-primary" onclick="startSession()">Start Audit</button>
</div>

<div id="audit-screen" style="display:none;">
  <div class="card">
    <div class="label">Location</div>
    <div class="val" id="disp-loc">-</div>
    <div class="label">WID (Scan/Verify)</div>
    <div class="val" style="color:#4f8ef7" id="disp-wid">-</div>
    <div class="label">Required Count</div>
    <div class="val" style="color:#ffffff" id="disp-count">0 / 0</div>
  </div>

  <div class="card">
    <div class="label">Scan WSN</div>
    <input type="text" id="wsn-input" placeholder="Scan WSN..." onkeydown="if(event.key==='Enter') verifyWSN()">
    <div style="display:flex; gap:10px; margin-top:10px;">
      <button class="btn btn-primary" onclick="verifyWSN()">Verify</button>
      <button class="btn btn-danger" onclick="markIssue()">Issue</button>
    </div>
  </div>
</div>

<div id="summary-screen" style="display:none;" class="card" style="text-align:center;">
  <h2>Session Complete</h2>
  <p>Show this 2D Barcode to Supervisor for Scanning:</p>
  <div id="qrcode"></div>
  <button class="btn btn-ghost" onclick="location.reload()" style="margin-top:20px;">New Audit</button>
</div>

let currentIndex = 0;
let empId = '';
let results = [];
let currentScannedWSNs = [];

function startSession() {
  empId = document.getElementById('empId').value.trim();
  if(!empId) return alert('Enter Emp ID');
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('audit-screen').style.display = 'block';
  loadCard();
}

function loadCard() {
  if(currentIndex >= DATA.length) return finishSession();
  const item = DATA[currentIndex];
  document.getElementById('disp-loc').textContent = item.location;
  document.getElementById('disp-wid').textContent = item.wid;
  document.getElementById('disp-count').textContent = currentScannedWSNs.length + ' / ' + item.expectedCount;
  document.getElementById('wsn-input').value = '';
  document.getElementById('wsn-input').focus();
}

function verifyWSN() {
  const val = document.getElementById('wsn-input').value.trim().toUpperCase();
  const item = DATA[currentIndex];
  
  if(!item.wsns.map(w=>w.toUpperCase()).includes(val)) {
    alert('Invalid WSN for this WID!');
    return;
  }
  
  if(!currentScannedWSNs.includes(val)) {
    currentScannedWSNs.push(val);
    results.push({ wsn: val, status: 'Done', remark: '' });
  }

  if(currentScannedWSNs.length >= item.expectedCount) {
    currentIndex++;
    currentScannedWSNs = [];
  }
  loadCard();
}

function markIssue() {
  const rem = prompt('Describe Issue:') || 'Count mismatch/Missing';
  const item = DATA[currentIndex];
  item.wsns.forEach(w => {
    results.push({ wsn: w, status: 'Issue', remark: rem });
  });
  currentIndex++;
  currentScannedWSNs = [];
  loadCard();
}

function finishSession() {
  document.getElementById('audit-screen').style.display = 'none';
  document.getElementById('summary-screen').style.display = 'block';
  
  // Encrypt session to compact payload format: EMP|WSN:STATUS:REMARK;...
  const payload = empId + '|' + results.map(r => r.wsn + ':' + r.status + ':' + r.remark).join(';');
  
  new QRCode(document.getElementById("qrcode"), {
    text: payload,
    width: 250,
    height: 250,
    correctLevel : QRCode.CorrectLevel.L
  });
}
